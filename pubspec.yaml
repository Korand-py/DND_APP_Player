name: dice_roller
description: "Приложение для броска игральных костей"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  widgetbook_generator: ^3.24.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.3

flutter:

  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
